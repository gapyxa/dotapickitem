<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dota 2 Item Pick by GAPYXA</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@700&family=Philosopher:wght@700&family=Exo+2:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#0a0c0f;--p:#14181e;--p2:#1b2028;--b:#2a313b;--t:#e8e6e1;--m:#8b94a1;--r:#c23c2a;--g:#d8b26a;--ok:#5fa83c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at top,#1a1214 0,var(--bg) 55%);color:var(--t);font:600 16px Rajdhani,"Segoe UI",sans-serif;min-height:100vh}
header{padding:18px 24px;border-bottom:1px solid var(--b);display:flex;align-items:center;gap:14px;background:linear-gradient(90deg,#2a1210,transparent)}
.logo{font:700 24px Cinzel,Georgia,serif;letter-spacing:2px}.logo span{color:var(--r)}
header small{color:var(--m)}
main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:18px;padding:18px;max-width:1400px;margin:auto}
@media(max-width:900px){main{grid-template-columns:1fr}}
.card{background:var(--p);border:1px solid var(--b);border-radius:10px;padding:14px}
h2{font:700 14px Cinzel,serif;letter-spacing:1.5px;color:var(--g);margin:0 0 10px;text-transform:uppercase}
input{width:100%;background:var(--p2);border:1px solid var(--b);color:var(--t);border-radius:8px;padding:10px 12px;font:600 16px Rajdhani,sans-serif;outline:none}
input:focus{border-color:var(--r)}
.row{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.btn{background:var(--p2);border:1px solid var(--b);color:var(--t);border-radius:8px;padding:7px 12px;cursor:pointer;font:700 14px Rajdhani,sans-serif}
.btn.on{background:var(--r);border-color:var(--r)}
.btn.my.on{background:var(--ok);border-color:var(--ok)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:6px;max-height:560px;overflow-y:auto;padding-right:4px}
.h{background:none;border:0;color:var(--t);cursor:pointer;padding:3px;border-radius:8px;font:600 11px Rajdhani,sans-serif;text-align:center}
.h:hover{background:var(--p2)}.h.used{opacity:.25;pointer-events:none}
.h b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
.ic{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;aspect-ratio:16/9;border-radius:6px;border:2px solid;font:700 18px Cinzel,serif;text-shadow:0 1px 3px #000}.ic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.team{margin-bottom:14px}.team h2.my{color:var(--ok)}.team h2.en{color:var(--r)}
.slots{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.slot{min-height:84px;border:1px dashed var(--b);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--m);padding:4px;cursor:pointer;font-size:12px;text-align:center}
.slot .ic{width:100%;font-size:14px}
.slot.f{border-style:solid;background:var(--p2)}.slot.f:hover{border-color:var(--r)}
.chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.chip{font-size:12px;background:var(--p2);border:1px solid var(--b);border-radius:20px;padding:2px 9px;color:var(--m)}
.bar{height:34px;border-radius:8px;overflow:hidden;display:flex;font:700 18px Rajdhani,sans-serif;border:1px solid var(--b)}
.bar div{display:flex;align-items:center;justify-content:center;transition:width .5s;min-width:46px}
.bar .a{background:linear-gradient(90deg,#2f6a1c,var(--ok))}.bar .e{background:linear-gradient(90deg,var(--r),#7c1e12)}
.sub{display:flex;justify-content:space-between;color:var(--m);font-size:13px;margin-top:6px}
.it{background:var(--p2);border-radius:8px;padding:10px;margin-bottom:8px;border-left:3px solid var(--g)}
.it b{color:var(--g)}.tag{display:inline-block;background:#2a1f10;border:1px solid #5a4620;color:var(--g);border-radius:6px;padding:2px 8px;margin:3px 4px 0 0;font-size:14px}
.why{color:var(--m);font-size:13px}
.tag.hit{background:#1d3a14;border-color:var(--ok);color:#a7e08a}.ai{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.ai p{margin:6px 0 0;color:var(--m);font-size:13px;flex-basis:100%}

body{background:radial-gradient(ellipse at 50% -10%,#3a1410 0,transparent 55%),radial-gradient(ellipse at 100% 100%,#101a2a 0,transparent 50%),#07090c}
header{border-bottom:2px solid #5a4620;box-shadow:0 4px 24px #c23c2a33;background:linear-gradient(90deg,#3a1511,#14181e 60%,#0d1015)}
.logo{text-shadow:0 0 14px #c23c2a99}
.card{border-radius:4px;border:1px solid #2b2620;border-top:2px solid #8a6d35;background:linear-gradient(180deg,#171a20,#0f1217);box-shadow:0 6px 20px #0008}
h2{display:flex;align-items:center;gap:10px}h2::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,#8a6d35,transparent)}
.btn{border-radius:3px;background:linear-gradient(180deg,#252b34,#171b22);border-color:#3a4350;text-transform:uppercase;letter-spacing:.5px;transition:.15s}
.btn:hover{border-color:var(--g);color:#fff}.btn.on{background:linear-gradient(180deg,#d9482f,#8c2415);box-shadow:0 0 10px #c23c2a88}
.btn.my.on{background:linear-gradient(180deg,#6fbf45,#2f6a1c);box-shadow:0 0 10px #5fa83c88}
.ic{border-radius:3px;border-width:1px}.ic::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--c)}
.h{transition:.15s}.h:hover{background:none;transform:translateY(-2px) scale(1.06);filter:brightness(1.2)}.h:hover .ic{box-shadow:0 0 12px var(--c)}
.team h2.my~.slots .slot.f{border-color:#2f6a1c;box-shadow:inset 0 -3px 0 var(--ok)}
.team h2.en~.slots .slot.f{border-color:#7c1e12;box-shadow:inset 0 -3px 0 var(--r)}
.bar{height:40px;border-radius:3px;box-shadow:0 0 18px #0009;font-size:22px}
.bar .a{box-shadow:inset 0 0 14px #9fe07a55}.bar .e{box-shadow:inset 0 0 14px #ff7a6a55}
select{background:#0d1015;color:var(--g);border:1px solid #5a4620;border-radius:3px;font:700 12px Rajdhani,sans-serif;margin-top:4px;padding:1px 2px}
input{border-radius:3px;background:#0d1015}
.it{border-radius:3px;background:linear-gradient(90deg,#1d2129,#14181e)}
.sec{grid-column:1/-1;display:flex;align-items:center;gap:8px;margin:8px 0 2px;font:700 14px Cinzel,serif;letter-spacing:2px;color:var(--c);text-transform:uppercase}.sec::before{content:"";width:9px;height:9px;background:var(--c);transform:rotate(45deg)}.sec::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--c),transparent)}.sec span{color:var(--m);font:600 12px Rajdhani,sans-serif}

header{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:14px}
